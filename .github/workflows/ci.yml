name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test --configuration Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Publish and smoke-test executables
        run: |
          New-Item -ItemType Directory -Path artifacts/pkg -Force | Out-Null
          foreach ($selfContained in @('false', 'true')) {
            $publishDirectory = "artifacts/publish-$selfContained"
            dotnet publish CodexSync.Cli/CodexSync.Cli.csproj `
              --configuration Release --runtime '${{ matrix.runtime }}' `
              --self-contained $selfContained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              --output $publishDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

            $extension = if ($IsWindows) { '.exe' } else { '' }
            $suffix = if ($selfContained -eq 'true') { '-selfcontained' } else { '' }
            $executable = "artifacts/pkg/codexsync$suffix$extension"
            Copy-Item "$publishDirectory/codexsync$extension" $executable
            & .github/scripts/smoke.ps1 -Executable $executable
          }
          Copy-Item .agents/skills/codexsync-setup/SKILL.md artifacts/pkg/SKILL.md

      - name: Package tested builds
        run: |
          if ($IsWindows) {
            Compress-Archive -Path artifacts/pkg/* -DestinationPath artifacts/codexsync-${{ matrix.runtime }}.zip
          } else {
            tar -czf artifacts/codexsync-${{ matrix.runtime }}.tar.gz -C artifacts/pkg .
            if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          }

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: codexsync-${{ matrix.runtime }}
          path: |
            artifacts/codexsync-*.zip
            artifacts/codexsync-*.tar.gz
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.runtime }}
          path: TestResults/*.trx
          if-no-files-found: warn
