name: Build and test

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test --configuration Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Publish and smoke-test executables
        run: |
          New-Item -ItemType Directory -Path artifacts/pkg -Force | Out-Null
          foreach ($selfContained in @('false', 'true')) {
            $publishDirectory = "artifacts/publish-$selfContained"
            dotnet publish CodexSync.Cli/CodexSync.Cli.csproj `
              --configuration Release --runtime '${{ matrix.runtime }}' `
              --self-contained $selfContained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              --output $publishDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

            $extension = if ($IsWindows) { '.exe' } else { '' }
            $suffix = if ($selfContained -eq 'true') { '-selfcontained' } else { '' }
            $executable = "artifacts/pkg/codexsync$suffix$extension"
            Copy-Item "$publishDirectory/codexsync$extension" $executable
            & .github/scripts/smoke.ps1 -Executable $executable
          }
          if ($IsLinux) {
            Copy-Item .agents/skills/codexsync-setup/SKILL.md artifacts/pkg/SKILL.md
          }

      - name: Test installers
        run: |
          if ($IsWindows) {
            & .github/scripts/test-install.ps1 -Executable artifacts/pkg/codexsync-selfcontained.exe
          } else {
            bash .github/scripts/test-install.sh artifacts/pkg/codexsync-selfcontained
            if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed.' }
          }

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: codexsync-${{ matrix.runtime }}
          path: artifacts/pkg/*
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.runtime }}
          path: TestResults/*.trx
          if-no-files-found: warn
